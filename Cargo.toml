[package]
name = "kd-tree"
version = "0.2.0"
authors = ["Yuichiro Terada <terada.yuichiro@gmail.com>"]
repository = "https://github.com/u1roh/kd-tree"
keywords = ["kdtree", "nearest-neighbor", "closest-point", "pointcloud"]
readme = "README.md"
description = "k-dimensional tree"
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
num-traits = "0.2.19"
ordered-float = "4.6.0"
arrayvec = "0.7.6"
rayon = "1.10.0"
nalgebra = "0.33.2"

[dev-dependencies]
rand = "0.8.5"
criterion = "0.5.1"
fux_kdtree = { version = "0.2.0", package = "fux_kdtree" }
kdtree = "0.7.0"
nalgebra = { version = "0.33.2", features = ["rand"] }
iai-callgrind = "0.14.0"

[[bench]]
name = "benchmark"
harness = false

[profile.bench]
lto = "thin"

[profile.bench-callgrind]
inherits = "bench"
debug = true

[[bench]]
name = "callgrind"
harness = false
