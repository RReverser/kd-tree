[package]
name = "kd-tree"
version = "0.2.0"
authors = ["Yuichiro Terada <terada.yuichiro@gmail.com>"]
repository = "https://github.com/u1roh/kd-tree"
keywords = ["kdtree", "nearest-neighbor", "closest-point", "pointcloud"]
readme = "README.md"
description = "k-dimensional tree"
license = "MIT"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
num-traits = "0.2.15"
ordered-float = "3.0.0"
arrayvec = "0.7.2"
rayon = "1.5.2"
nalgebra = "0.31.0"

[dev-dependencies]
rand = "0.8.5"
criterion = "0.3.5"
fux_kdtree = { version = "0.2.0", package = "fux_kdtree" }
kdtree = "0.6.0"

[[bench]]
name = "benchmark"
harness = false

[profile.bench]
lto = true
